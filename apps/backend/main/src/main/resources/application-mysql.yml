# ============================================================
# MySQL profile（可选）：先 docker compose up -d 起库，再用 mysql profile 启动
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# 覆盖规则：本文件的同名配置会覆盖 application.yml；未写的项继续沿用默认值
# ============================================================
spring:
  datasource:
    # 端口 13307：避开本机已占用的 3306 / 3307，compose 里做 13307:3306 映射
    url: jdbc:mysql://localhost:13307/fullstack_base?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123         # 仅本地开发用；真实项目务必走环境变量，不要提交明文

  h2:
    console:
      enabled: false          # 用真实 MySQL 时关掉 H2 控制台

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# MySQL 下打印 SQL 便于对照，部署时记得关掉
logging:
  level:
    com.example.base.modules: debug
