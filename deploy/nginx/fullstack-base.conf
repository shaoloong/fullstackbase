# fullstack-base 反向代理示例（部署期用，本地开发用 Vite 代理）

# 上游：Spring Boot 内嵌 Tomcat（默认 8082）
upstream fb_backend {
    server 127.0.0.1:8082;
    keepalive 32;
}

server {
    listen       80;
    server_name  localhost;

    # 前端构建产物（vite build 输出到 apps/frontend/dist）
    root  /opt/fullstack-base/dist;
    index index.html;

    # 业务接口与契约文档统一转后端
    location /api/ {
        proxy_pass         http://fb_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    location ~ ^/(v3/api-docs|swagger-ui|h2-console|preview.html|vendor/) {
        proxy_pass         http://fb_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA history 路由：找不到静态文件就回 index.html（vue-router 必需）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存；index.html 不缓存，避免发版后用户拿到旧入口
    location ~* \.(js|css|png|svg|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
